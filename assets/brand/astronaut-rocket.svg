<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" role="img">
  <title>Barn Dom cute astronaut floating beside a rocket among stars</title>

  <!-- soft background bubbles -->
  <circle cx="95" cy="410" r="42" fill="#EDE9FE" opacity="0.6"/>
  <circle cx="470" cy="410" r="26" fill="#C4B5FD" opacity="0.5"/>
  <circle cx="60" cy="200" r="18" fill="#EDE9FE" opacity="0.5"/>
  <circle cx="540" cy="330" r="16" fill="#EDE9FE" opacity="0.5"/>

  <!-- ringed planet -->
  <g transform="translate(495,95)">
    <ellipse cx="0" cy="0" rx="66" ry="20" transform="rotate(-18)" fill="none" stroke="#7C3AED" stroke-width="6" opacity="0.9"/>
    <circle cx="0" cy="0" r="34" fill="#C4B5FD" stroke="#4C1D95" stroke-width="5"/>
    <circle cx="-10" cy="-8" r="6" fill="#7C3AED" opacity="0.5"/>
    <circle cx="12" cy="10" r="4" fill="#7C3AED" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="66" ry="20" transform="rotate(-18)" fill="none" stroke="#4C1D95" stroke-width="6" opacity="0.35"/>
  </g>

  <!-- stars -->
  <g fill="#FACC15">
    <path d="M64 70 L70 84 L84 90 L70 96 L64 110 L58 96 L44 90 L58 84 Z"/>
    <path d="M160 330 L164 340 L174 344 L164 348 L160 358 L156 348 L146 344 L156 340 Z"/>
    <path d="M388 55 L393 67 L405 72 L393 77 L388 89 L383 77 L371 72 L383 67 Z"/>
    <path d="M556 235 L560 245 L570 249 L560 253 L556 263 L552 253 L542 249 L552 245 Z"/>
    <path d="M255 435 L259 444 L268 448 L259 452 L255 461 L251 452 L242 448 L251 444 Z"/>
  </g>

  <!-- rocket -->
  <g transform="translate(432,268) rotate(14)">
    <!-- flame -->
    <path d="M-20 130 C-30 150 -14 172 0 186 C14 172 30 150 20 130 C12 148 -12 148 -20 130 Z" fill="#FB923C" stroke="#4C1D95" stroke-width="5" stroke-linejoin="round"/>
    <path d="M-10 130 C-15 143 -6 156 0 164 C6 156 15 143 10 130 C6 140 -6 140 -10 130 Z" fill="#FACC15"/>

    <!-- fins -->
    <path d="M-40 60 L-72 108 C-78 116 -70 128 -58 126 L-40 118 Z" fill="#7C3AED" stroke="#4C1D95" stroke-width="6" stroke-linejoin="round"/>
    <path d="M40 60 L72 108 C78 116 70 128 58 126 L40 118 Z" fill="#7C3AED" stroke="#4C1D95" stroke-width="6" stroke-linejoin="round"/>

    <!-- body -->
    <rect x="-42" y="-56" width="84" height="176" rx="42" fill="#FFFFFF" stroke="#4C1D95" stroke-width="6"/>

    <!-- window -->
    <circle cx="0" cy="6" r="28" fill="#EDE9FE" stroke="#4C1D95" stroke-width="6"/>
    <circle cx="0" cy="6" r="15" fill="#7C3AED"/>
    <circle cx="-6" cy="0" r="4" fill="#FFFFFF" opacity="0.8"/>

    <!-- purple belt stripe -->
    <rect x="-42" y="62" width="84" height="16" fill="#C4B5FD" stroke="#4C1D95" stroke-width="4"/>

    <!-- nose cone -->
    <path d="M-42 -56 C-42 -108 42 -108 42 -56 Z" fill="#7C3AED" stroke="#4C1D95" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="0" cy="-84" r="7" fill="#FACC15"/>
  </g>

  <!-- astronaut -->
  <g transform="translate(210,260)">
    <!-- backpack -->
    <rect x="-40" y="0" width="80" height="106" rx="24" fill="#C4B5FD" stroke="#4C1D95" stroke-width="6"/>

    <!-- legs -->
    <path d="M-30 96 C-38 122 -38 148 -30 168 C-22 178 -4 178 -4 166 C-10 148 -10 122 -10 100 Z" fill="#FFFFFF" stroke="#4C1D95" stroke-width="6" stroke-linejoin="round"/>
    <path d="M30 96 C38 122 38 148 30 168 C22 178 4 178 4 166 C10 148 10 122 10 100 Z" fill="#FFFFFF" stroke="#4C1D95" stroke-width="6" stroke-linejoin="round"/>
    <rect x="-34" y="160" width="34" height="26" rx="13" fill="#7C3AED" stroke="#4C1D95" stroke-width="6"/>
    <rect x="0" y="160" width="34" height="26" rx="13" fill="#7C3AED" stroke="#4C1D95" stroke-width="6"/>

    <!-- body suit -->
    <rect x="-52" y="6" width="104" height="118" rx="46" fill="#FFFFFF" stroke="#4C1D95" stroke-width="6"/>

    <!-- back arm (resting), drawn as a rounded tube on top of the body -->
    <path d="M46 26 C82 36 94 64 86 92" fill="none" stroke="#4C1D95" stroke-width="20" stroke-linecap="round"/>
    <path d="M46 26 C82 36 94 64 86 92" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <circle cx="86" cy="92" r="16" fill="#EDE9FE" stroke="#4C1D95" stroke-width="5"/>

    <!-- front arm (waving), drawn as a rounded tube on top of the body -->
    <path d="M-46 26 C-90 12 -114 -26 -112 -70" fill="none" stroke="#4C1D95" stroke-width="20" stroke-linecap="round"/>
    <path d="M-46 26 C-90 12 -114 -26 -112 -70" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <circle cx="-112" cy="-70" r="16" fill="#EDE9FE" stroke="#4C1D95" stroke-width="5"/>

    <!-- chest badge -->
    <circle cx="0" cy="56" r="20" fill="#7C3AED" stroke="#4C1D95" stroke-width="5"/>
    <path d="M0 46 L4 54 L13 56 L4 58 L0 66 L-4 58 L-13 56 L-4 54 Z" fill="#FACC15"/>

    <!-- helmet -->
    <circle cx="0" cy="-70" r="92" fill="#EDE9FE" stroke="#4C1D95" stroke-width="7"/>
    <circle cx="0" cy="-66" r="66" fill="#4C1D95"/>

    <!-- face -->
    <circle cx="-22" cy="-70" r="9" fill="#FFFFFF"/>
    <circle cx="-22" cy="-68" r="4.5" fill="#1E1B4B"/>
    <circle cx="22" cy="-70" r="9" fill="#FFFFFF"/>
    <circle cx="22" cy="-68" r="4.5" fill="#1E1B4B"/>
    <path d="M-18 -46 C-8 -34 8 -34 18 -46" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="-38" cy="-52" rx="8" ry="6" fill="#F472B6" opacity="0.7"/>
    <ellipse cx="38" cy="-52" rx="8" ry="6" fill="#F472B6" opacity="0.7"/>

    <!-- helmet shine -->
    <ellipse cx="-38" cy="-108" rx="20" ry="12" fill="#FFFFFF" opacity="0.35" transform="rotate(-20 -38 -108)"/>

    <!-- antenna -->
    <circle cx="60" cy="-146" r="8" fill="#FACC15" stroke="#4C1D95" stroke-width="4"/>
    <path d="M46 -132 L56 -142" stroke="#4C1D95" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
