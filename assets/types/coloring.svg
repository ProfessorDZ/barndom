<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
  <title>Coloring page of a rocket, partly colored, with crayons</title>
  <rect x="8" y="8" width="384" height="284" rx="32" fill="#EDE9FE" stroke="#4C1D95" stroke-width="5"/>

  <path d="M40 34 L45 46 L57 50 L45 54 L40 66 L35 54 L23 50 L35 46 Z" fill="#FACC15"/>
  <path d="M362 254 L366 263 L375 267 L366 271 L362 280 L358 271 L349 267 L358 263 Z" fill="#FACC15"/>

  <!-- paper -->
  <rect x="112" y="34" width="180" height="204" rx="14" fill="#FFFFFF" stroke="#4C1D95" stroke-width="5"/>

  <!-- rocket coloring-page drawing: partly colored -->
  <path d="M177 78 C177 54 225 54 225 78 Z" fill="#7C3AED" stroke="#4C1D95" stroke-width="5" stroke-linejoin="round"/>
  <rect x="177" y="78" width="48" height="96" rx="24" fill="#FFFFFF" stroke="#4C1D95" stroke-width="5"/>
  <circle cx="201" cy="112" r="15" fill="none" stroke="#4C1D95" stroke-width="4"/>
  <path d="M177 134 L158 168 L177 158 Z" fill="#F472B6" stroke="#4C1D95" stroke-width="5" stroke-linejoin="round"/>
  <path d="M225 134 L244 168 L225 158 Z" fill="none" stroke="#4C1D95" stroke-width="5" stroke-linejoin="round"/>
  <path d="M187 174 L201 202 L215 174 Z" fill="none" stroke="#4C1D95" stroke-width="4" stroke-linejoin="round"/>

  <!-- crayons -->
  <g transform="translate(88,248) rotate(-25)">
    <path d="M-9 -45 L9 -45 L0 -63 Z" fill="#F472B6" stroke="#4C1D95" stroke-width="4" stroke-linejoin="round"/>
    <rect x="-9" y="-45" width="18" height="68" rx="8" fill="#F472B6" stroke="#4C1D95" stroke-width="4"/>
    <rect x="-9" y="-8" width="18" height="12" fill="#FFFFFF" stroke="#4C1D95" stroke-width="3"/>
  </g>
  <g transform="translate(112,254) rotate(-6)">
    <path d="M-9 -45 L9 -45 L0 -63 Z" fill="#FACC15" stroke="#4C1D95" stroke-width="4" stroke-linejoin="round"/>
    <rect x="-9" y="-45" width="18" height="68" rx="8" fill="#FACC15" stroke="#4C1D95" stroke-width="4"/>
    <rect x="-9" y="-8" width="18" height="12" fill="#FFFFFF" stroke="#4C1D95" stroke-width="3"/>
  </g>
  <g transform="translate(136,246) rotate(14)">
    <path d="M-9 -45 L9 -45 L0 -63 Z" fill="#7C3AED" stroke="#4C1D95" stroke-width="4" stroke-linejoin="round"/>
    <rect x="-9" y="-45" width="18" height="68" rx="8" fill="#7C3AED" stroke="#4C1D95" stroke-width="4"/>
    <rect x="-9" y="-8" width="18" height="12" fill="#FFFFFF" stroke="#4C1D95" stroke-width="3"/>
  </g>
</svg>
